# A minimal, runnable example. The point is to show how an app sits on top of
# iron-debian — unprivileged, writing only under $TMP_DIR, reading a config
# from $CONF_DIR — not to be a TLS reference configuration.
#
# The upstream example this replaced could not start: it listened on 8443 ssl
# with every ssl_certificate line commented out, logged to a directory the
# image does not create, and pinned TLSv1 and TLSv1.1. Terminate TLS at your
# ingress and serve plaintext here, or use iron-nginx, which is built for it.

# The image has no /var/log and no writable /etc, so both logs go to the
# container's stdout and stderr where a log collector can see them.
# Without this nginx forks into the background and the container exits
# immediately with no error.
daemon off;

error_log /dev/stderr warn;
pid /app/tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log /dev/stdout;

  # Everything nginx would otherwise write under /var goes to $TMP_DIR, the
  # one directory post-install.sh leaves writable.
  client_body_temp_path /app/tmp/client_body;
  proxy_temp_path       /app/tmp/proxy;
  fastcgi_temp_path     /app/tmp/fastcgi;
  uwsgi_temp_path       /app/tmp/uwsgi;
  scgi_temp_path        /app/tmp/scgi;

  sendfile on;
  keepalive_timeout 65;

  # Do not advertise the version in error pages or the Server header.
  server_tokens off;

  # Do not render inside a frame belonging to someone else.
  add_header X-Frame-Options SAMEORIGIN always;
  # Do not let a browser guess a content type the server did not state.
  add_header X-Content-Type-Options nosniff always;
  # Same-origin only by default; widen it for what your app actually loads.
  add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  server {
    # Above 1024, because the container does not run as root and cannot bind
    # a privileged port.
    listen 8080 default_server;
    server_name _;

    root /app/data;
    index index.html;

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
